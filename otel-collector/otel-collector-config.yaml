extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  docker_stats:
    endpoint: tcp://socat:2375
    collection_interval: 15s

exporters:
  otlp_grpc/hdx:
    endpoint: 'clickstack:4317'
    headers:
      authorization: ${env:HYPERDX_API_KEY}
    tls:
      insecure: true
    # Batching happens in the exporter's sending queue (the batch processor
    # is deprecated).
    sending_queue:
      enabled: true
      batch: {}
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [docker_stats]
      exporters: [otlp_grpc/hdx]
